services:
  mongo:
    image: mongo:7
    container_name: nexxa-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-nexxa_waitlist}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      # Sửa chỗ này thành đường dẫn thư mục trên máy chủ của bạn
      - ./data/db:/data/db
      - ./data/configdb:/data/configdb
